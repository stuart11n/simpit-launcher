name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve version stamp
        id: version
        shell: pwsh
        run: |
          $ver = & .\scripts\Get-VersionStamp.ps1
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version stamp: $ver"

      - name: Restore
        run: dotnet restore .\SimpitLauncher.csproj -p:Platform=x64

      - name: Build
        run: dotnet build .\SimpitLauncher.csproj -c Release -p:Platform=x64 --no-restore -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Publish + installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\package.ps1 -Configuration Release -Version "${{ steps.version.outputs.version }}"

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: SimpitLauncher-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SimpitLauncherSetup
          path: |
            artifacts/installer/SimpitLauncherSetup.exe
            artifacts/installer/SimpitLauncherSetup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Zip publish folder for release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts\publish\win-x64\* `
            -DestinationPath artifacts\SimpitLauncher-win-x64.zip -Force

      - name: Publish latest GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "latest"
          $title = "Simpit Launcher (latest)"
          $setup = "artifacts/installer/SimpitLauncherSetup.exe"
          $zip = "artifacts/SimpitLauncher-win-x64.zip"
          $notes = @"
          Windows x64 installer for Simpit Launcher $env:VERSION.

          Source: $($env:GITHUB_REPOSITORY)@$($env:GITHUB_SHA)
          "@
          $notesFile = "artifacts/release-notes.md"
          Set-Content -Path $notesFile -Value $notes.Trim() -Encoding utf8

          $exists = $true
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { $exists = $false }

          if ($exists) {
            gh release edit $tag --title $title --notes-file $notesFile
            gh release upload $tag $setup $zip --clobber
          } else {
            gh release create $tag $setup $zip --title $title --notes-file $notesFile
          }

          Write-Host "Published $tag ($env:VERSION)"
